# Postgres for reviewers running locally. See the README for how to verify the evidence.
#
# There is deliberately no `container_name:` here. A fixed name is global to the
# Docker daemon, so a second checkout of this repo failed at the very first
# command with `Conflict. The container name "/transpay-db" is already in use`.
# Without it, Compose names the container after the project (the directory), and
# two checkouts can run side by side. The host port below is still fixed, so if
# 5434 is taken, change it here AND in DATABASE_URL in .env — see the README.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transpay
      POSTGRES_PASSWORD: transpay
      POSTGRES_DB: transpay
    ports:
      - '5434:5432'
    volumes:
      - transpay-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U transpay -d transpay']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transpay-pgdata:
